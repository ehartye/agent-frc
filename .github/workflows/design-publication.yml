name: Design publication
# The workflow a robot project calls from its own .github/workflows/design-publication.yml, which is a few lines
# (templates/design-publication.yml). The behaviour is here, so a project follows the plugin's current release and has
# nothing to copy again. When each check runs: docs/testing-methodology.md.
on:
  workflow_call:
    inputs:
      runner:
        description: The runner of the Design publication job. Empty selects a hosted runner.
        type: string
        default: ''
      jobs:
        description: Worker processes of a layout check rerun. Empty lets the layout check choose.
        type: string
        default: ''
      rerun-all:
        description: Rerun the layout check for every in-progress and effective design
        type: boolean
        default: false
      deploy:
        description: Upload the docs folder and deploy it to Pages from the default branch. False for a site served from the docs folder.
        type: boolean
        default: true
      lfs:
        description: Fetch Git LFS files, for a STEP or Fusion archive stored with Git LFS
        type: boolean
        default: false
      python-version:
        description: The interpreter the layout check runs with
        type: string
        default: '3.13'
      ocp-version:
        description: The CAD kernel the layout check runs with
        type: string
        default: 8.0.1.0.0
      numpy-version:
        type: string
        default: 2.5.3
permissions:
  contents: read
jobs:
  scan:
    name: Paths and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The plugin at its current release, the same one this workflow file is read from.
          repository: ehartye/agent-frc
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # A personal machine path or a credential is public as soon as the branch is pushed, with or without a pull request.
      - run: node plugin/scripts/branch-scan.mjs project

  check:
    name: Design publication
    # The runner is a project setting: the label of a self-hosted runner runs the stage gate on the project's own
    # machine. The calling workflow runs on pushes only, which come from people with write access.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Room for the stage gate of one preliminary and one detailed design at the per-design budget below. The guideline
    # for a gate is about 15 minutes, and the check says so when a rerun passes it.
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash on a Windows runner, bash elsewhere.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
          lfs: ${{ inputs.lfs }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The plugin at its current release, the same one this workflow file is read from.
          repository: ehartye/agent-frc
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ inputs.python-version }}
      - run: python -m pip install "cadquery-ocp==$OCP_VERSION" "numpy==$NUMPY_VERSION"
        env:
          OCP_VERSION: ${{ inputs.ocp-version }}
          NUMPY_VERSION: ${{ inputs.numpy-version }}
      # Every push runs the publication checks: index, receipt, scene, animation. The layout check itself reruns only at
      # the stage gate: once, for a design this branch makes effective. A draft, a rename and a page change never start it.
      - name: Check the published designs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          RERUN_ALL: ${{ inputs.rerun-all }}
          JOBS: ${{ inputs.jobs }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            # The default branch does not repeat the gate of the branch that was merged. It still holds an effective
            # design to the physics it had at the commit before.
            args+=(--skip-rerun)
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then args+=(--base "$BEFORE"); fi
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A branch is compared with the commit it left the default branch at: what it makes effective is gated.
            if base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null); then args+=(--base "$base"); fi
          fi
          # A manual run has no base and reruns nothing, unless it asks for every design.
          if [[ "$RERUN_ALL" == true ]]; then args+=(--rerun all); fi
          if [[ -n "$JOBS" ]]; then args+=(--jobs "$JOBS"); fi
          node plugin/scripts/design-publication.mjs check project --budget-minutes 45 "${args[@]}"
      # The project's own evidence regressions, registered in tests/ci.json.
      - name: Run the project's registered checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true); fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$base" || "$base" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$base" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$base"
          fi
      - if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: project/docs

  deploy:
    if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [scan, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: design-publication-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
