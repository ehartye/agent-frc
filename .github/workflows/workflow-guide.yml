name: Robot design field guide
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_AUTHOR_NAME: Plugin test fixture
      GIT_AUTHOR_EMAIL: tests@example.invalid
      GIT_COMMITTER_NAME: Plugin test fixture
      GIT_COMMITTER_EMAIL: tests@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # the changed-files selection compares with the merge base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/workflow-guide.yml # the pinned versions are in this file
      - run: python -m pip install Pillow==11.3.0 numpy==2.5.3
      - name: Prepare the workflow syntax checker used by the regression
        env:
          ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "FRC_ACTIONLINT=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - run: npm run validate
      # A pull request runs the tests that cover its changed files. Main and a manual run execute the whole portable suite.
      - name: Run the tests
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/test-suite.mjs --portable --changed "origin/$GITHUB_BASE_REF"
          else
            npm run test:portable
          fi
  rerun:
    name: Layout check rerun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0 # the changed-files selection compares with the merge base
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # The job always reports. On a pull request the kernel steps run only when a changed file reaches the rerun test.
      - name: Decide whether this change reaches the rerun test
        id: reach
        run: |
          run=true
          library=true
          audit=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            node scripts/test-suite.mjs --changed "origin/$GITHUB_BASE_REF" --list design-publication kernel-layout.test design-audit-library | tee "$RUNNER_TEMP/selection.txt"
            grep -q 'design-publication.test.mjs$' "$RUNNER_TEMP/selection.txt" || run=false
            grep -q 'kernel-layout.test.mjs$' "$RUNNER_TEMP/selection.txt" || library=false
            grep -q 'design-audit-library.test.mjs$' "$RUNNER_TEMP/selection.txt" || audit=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
          echo "Layout check rerun test: run=$run. Layout check on the design library: run=$library. Design audit on the design library: run=$audit" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.reach.outputs.run == 'true' || steps.reach.outputs.library == 'true' || steps.reach.outputs.audit == 'true'
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: .github/workflows/workflow-guide.yml # the pinned versions are in this file
      # The same interpreter and kernel versions as the defaults of .github/workflows/design-publication.yml, so that install is exercised here.
      - if: steps.reach.outputs.run == 'true' || steps.reach.outputs.library == 'true' || steps.reach.outputs.audit == 'true'
        run: python -m pip install "cadquery-ocp==8.0.1.0.0" "numpy==2.5.3"
      # The design library is not pinned: its main branch is the release, so this installs whatever is there now.
      - if: steps.reach.outputs.library == 'true' || steps.reach.outputs.audit == 'true'
        run: python -m pip install "git+https://github.com/ehartye/frc-design-kernel"
      # Checks an invented design source with the design library and rejects interference, a floating solid, an
      # overweight ledger and stale generated solids.
      - if: steps.reach.outputs.library == 'true'
        run: node --test test/kernel-layout.test.mjs
        env:
          FRC_TEST_PROFILE: station
      # Builds and measures an invented design with the design library, then audits it: a fresh build regenerates, and a
      # hand-edited manifest or STEP, an earlier source and a changed custom file are each reported.
      - if: steps.reach.outputs.audit == 'true'
        run: node --test test/design-audit-library.test.mjs
        env:
          FRC_TEST_REQUIRE_LIBRARY: '1' # here the library is installed, so a skip would hide a failure
      # Builds a synthetic release with the real layout check, marks it effective through the stage gate the agent runs,
      # checks a rename and a view refresh with no layout check and rejects a stale and a forged receipt.
      - if: steps.reach.outputs.run == 'true'
        run: node --test test/design-publication.test.mjs
        env:
          FRC_TEST_PROFILE: station
  build:
    needs: check
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python examples/swerve/check-readme-preview.py
      - run: node .github/pages/build.mjs artifacts/workflow-guide
      - if: github.event_name == 'push'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/workflow-guide
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: deploy-design-guide
      cancel-in-progress: false
    steps:
      - name: Publish the field guide
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
