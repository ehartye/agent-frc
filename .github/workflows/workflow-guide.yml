name: Robot design field guide
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/pages/**'
      - '.github/readme/**'
      - 'references/cad-color-convention.json'
      - '.github/workflows/workflow-guide.yml'
      - 'skills/**'
      - 'docs/**'
      - 'templates/**'
      - 'scripts/kickoff*.mjs'
      - 'scripts/field-rehearsal*.mjs'
      - 'examples/kickoff/training-field.json'
      - 'examples/highlights/**'
      - 'examples/swerve/**'
      - '**/README.md'
      - 'README.md'
      - 'scripts/robot-highlights.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python examples/swerve/check-readme-preview.py
      - run: node .github/pages/build.mjs artifacts/workflow-guide
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/workflow-guide
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: deploy-design-guide
      cancel-in-progress: false
    steps:
      - name: Publish the field guide
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
