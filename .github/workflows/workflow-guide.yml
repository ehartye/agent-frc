name: Robot design field guide
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Plugin checks
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Plugin test fixture
      GIT_AUTHOR_EMAIL: tests@example.invalid
      GIT_COMMITTER_NAME: Plugin test fixture
      GIT_COMMITTER_EMAIL: tests@example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 numpy==2.2.6
      - name: Prepare the workflow syntax checker used by the regression
        env:
          ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "$ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "FRC_ACTIONLINT=$RUNNER_TEMP/actionlint" >> "$GITHUB_ENV"
      - run: npm run validate
      - run: npm run test:portable
  rerun:
    name: Layout check rerun
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      # The same interpreter and kernel versions as templates/design-publication.yml, so the template's install is exercised here.
      - run: python -m pip install "cadquery-ocp==8.0.1.0.0" "numpy==2.5.3"
      # Builds a synthetic release with the real layout check, reruns it as a project's CI does and rejects a forged receipt.
      - run: node --test test/design-publication.test.mjs
        env:
          FRC_TEST_PROFILE: station
  build:
    needs: check
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python examples/swerve/check-readme-preview.py
      - run: node .github/pages/build.mjs artifacts/workflow-guide
      - if: github.event_name == 'push'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: artifacts/workflow-guide
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: deploy-design-guide
      cancel-in-progress: false
    steps:
      - name: Publish the field guide
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
