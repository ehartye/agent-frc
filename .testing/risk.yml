# Risk map for the plugin's own tests. Method: docs/testing-methodology.md.
# First matching area wins, so specific areas come before broad ones.
phase: dev
# The plugin is a tool of the coding agent. No robot project depends on it, and no old format is kept working.
consumers: []
weights:
  wait: 1
  agent: 1
  ci: 1
  churn: 1
lanes:
  edit:
    runs: affected-files
    trigger: agent-edit
  merge:
    runs: critical+standard
    trigger: local-pre-push
  # No scheduled run exists. A test tagged for this lane runs when someone asks for the full suite, and at a release.
  scheduled:
    runs: all
    trigger: on-request
    os:
      - windows
      - ubuntu
  release:
    runs: all+clean-install
    trigger: tag
    os:
      - windows
      - ubuntu
areas:
  # The layout check: a false pass is the worst failure.
  - path: scripts/kernel_layout/**
    tier: critical
    why: the layout check on the design library; a false pass publishes a layout that interferes
  - path: scripts/layout_check.py
    tier: critical
    why: the command of the layout check on the design library
  # The stage gate.
  - path: scripts/design-publication.mjs
    tier: critical
    why: publication checks and the stage gate
  - path: scripts/physics-identity.mjs
    tier: critical
    why: what an effective design is held to; a false match lets its physics change without a gate
  - path: scripts/effective-readiness.mjs
    tier: critical
    why: the readiness report read at the stage gate
  - path: scripts/detailed-design-release.mjs
    tier: critical
    why: status changes for detailed designs
  - path: scripts/mechanical_readiness.py
    tier: critical
    why: the review a detailed design needs to become effective
  - path: scripts/bench-tests.mjs
    tier: critical
    why: bench-test records the detailed stage gate reads
  - path: scripts/stage-gate.mjs
    tier: critical
    why: the stage gate the agent runs when a design is marked effective
  - path: scripts/stage_preliminary_review.py
    tier: critical
    why: staging and status changes for preliminary designs
  - path: templates/project-ci/**
    tier: critical
    why: the scan, site check and workflow a project copies and then owns; they must stand with no plugin
  - path: examples/sample-project/**
    tier: critical
    why: proves the reference CI runs in a project that holds nothing of the plugin
  - path: scripts/project-ci-audit.mjs
    tier: standard
    why: advice to the agent; a missed use lets a project go on running plugin code unnoticed
  - path: scripts/design-audit.mjs
    tier: standard
    why: advice to the agent; a missed escape-hatch misuse or a stale output lets a design drift back toward a hand-written builder unnoticed
  - path: scripts/design-audit/**
    tier: standard
    why: the design auditor's detectors; same risk as the auditor
  - path: scripts/published-content.mjs
    tier: standard
    why: advice to the agent; a missed file lets a withdrawn viewer or model be published with the folder
  # Publishing hygiene.
  - path: scripts/branch-scan.mjs
    tier: critical
    why: keeps personal paths and secrets out of public repositories
  # The published page.
  - path: templates/preliminary-review/**
    tier: critical
    why: the design review page a reviewer opens
  - path: templates/preliminary-review-index.html
    tier: critical
    why: the picker
  - path: scripts/review-scene.mjs
    tier: critical
    why: the scene the page plays
  - path: scripts/package_view.py
    tier: critical
    why: writes the scene and the animations
  # Low: presentation, examples and teaching material.
  - path: examples/**
    tier: low
    why: examples
  - path: worksheets/**
    tier: low
    why: teaching material
  - path: docs/**
    tier: low
    why: documents; checked by the validator and the link tests
  - path: .github/pages/**
    tier: low
    why: the public guide
  # Everything else.
  - path: scripts/**
    tier: standard
    why: tools
  - path: templates/**
    tier: standard
    why: starting files a project uses
  - path: skills/**
    tier: standard
    why: skill text; checked by the skill validator
  - path: references/**
    tier: standard
    why: reference data
