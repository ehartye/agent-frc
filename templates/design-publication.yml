name: Design publication
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      rerun-all:
        description: Rerun the layout check for every in-progress and effective design
        type: boolean
        default: false
permissions:
  contents: read
env:
  # The one plugin pin: a release tag or full commit of ehartye/agent-frc. Change it by pull request.
  AGENT_FRC_REF: set-to-a-plugin-tag-or-commit
  # The interpreter and CAD kernel the layout check runs with. Keep them at the versions the project checks with locally.
  PYTHON_VERSION: '3.13'
  OCP_VERSION: 8.0.1.0.0
  NUMPY_VERSION: 2.5.3
jobs:
  scan:
    name: Paths and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: ${{ env.AGENT_FRC_REF }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      # A personal machine path or a credential is public as soon as the branch is pushed, with or without a pull request.
      - run: node plugin/scripts/branch-scan.mjs project

  check:
    name: Design publication
    # The runner is a project setting. Set the repository variable DESIGN_CHECK_RUNNER to the label of a self-hosted
    # runner to run the stage gate on the project's own machine; without it the job runs on a hosted runner. The
    # workflow runs on pushes only, which come from people with write access. Keep it that way on a public repository:
    # a pull_request trigger would run a stranger's code on a self-hosted runner.
    runs-on: ${{ vars.DESIGN_CHECK_RUNNER || 'ubuntu-latest' }}
    # Room for the stage gate of one preliminary and one detailed design at the per-design budget below. A manual
    # run with rerun-all on many designs may need more.
    timeout-minutes: 120
    defaults:
      run:
        # Git Bash on a Windows runner, bash elsewhere.
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
          # Set lfs: true when a STEP or Fusion archive is stored with Git LFS.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: ${{ env.AGENT_FRC_REF }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install "cadquery-ocp==$OCP_VERSION" "numpy==$NUMPY_VERSION"
      # Every push: each in-progress or effective design has a layout-checked receipt of its committed files, the review
      # shows the receipt's numbers, a mission animation plays and the status index is consistent. The layout check
      # itself reruns only at the stage gate: once, for a design this branch makes effective. A draft is not rerun.
      - name: Check the published designs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          RERUN_ALL: ${{ inputs.rerun-all }}
          # Worker processes of a rerun, from the repository variable DESIGN_CHECK_JOBS. Unset, the layout check chooses.
          JOBS: ${{ vars.DESIGN_CHECK_JOBS }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            # The default branch does not repeat the gate of the branch that was merged. It still holds an effective
            # design to the physics it had at the commit before.
            args+=(--skip-rerun)
            if [[ -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then args+=(--base "$BEFORE"); fi
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            # A branch is compared with the commit it left the default branch at: what it makes effective is gated.
            if base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null); then args+=(--base "$base"); fi
          fi
          # A manual run has no base and reruns nothing, unless it asks for every design.
          if [[ "$RERUN_ALL" == true ]]; then args+=(--rerun all); fi
          if [[ -n "$JOBS" ]]; then args+=(--jobs "$JOBS"); fi
          node plugin/scripts/design-publication.mjs check project --budget-minutes 45 "${args[@]}"
      # The project's own evidence regressions, registered in tests/ci.json.
      - name: Run the project's registered checks
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then base=$(git -C project merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true); fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$base" || "$base" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$base" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$base"
          fi
      # A site served from the docs folder of the default branch needs no upload: delete this step and the deploy job.
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: project/docs

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: [scan, check]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: design-publication-pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
