name: Design publication
# This file holds no behaviour. It calls the Agent FRC plugin's workflow at the plugin's current release, so the project
# has nothing to copy again when the plugin changes. When each check runs:
# https://github.com/ehartye/agent-frc/blob/main/docs/testing-methodology.md
on:
  # Pushes only. They come from people with write access; a pull_request trigger would run a stranger's code, which
  # matters most on a self-hosted runner.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      rerun-all:
        description: Rerun the layout check for every in-progress and effective design
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  designs:
    uses: ehartye/agent-frc/.github/workflows/design-publication.yml@main
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      rerun-all: ${{ inputs.rerun-all || false }}
      # Project settings, as repository variables. DESIGN_CHECK_RUNNER names a self-hosted runner for the stage gate;
      # DESIGN_CHECK_JOBS sets its worker processes. Unset, the job runs on a hosted runner and the check chooses.
      runner: ${{ vars.DESIGN_CHECK_RUNNER }}
      jobs: ${{ vars.DESIGN_CHECK_JOBS }}
      # deploy: false    # for a site served from the docs folder of the default branch
      # lfs: true        # when a STEP or Fusion archive is stored with Git LFS
