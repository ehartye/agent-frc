name: Project checks
on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Project checks
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: project
          fetch-depth: 0
          persist-credentials: false
      - name: Check the owner-selected plugin revision
        env:
          PIN: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
        run: '[[ "$PIN" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ehartye/agent-frc
          ref: ${{ vars.AGENT_FRC_PLUGIN_SHA }}
          path: plugin
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Select the registered JDK for a Java robot project
        if: vars.FRC_JAVA_MAJOR != ''
        env:
          JAVA_MAJOR: ${{ vars.FRC_JAVA_MAJOR }}
        run: |
          [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]
          var="JAVA_HOME_${JAVA_MAJOR}_X64"
          jdk="${!var:?Install the registered JDK on this runner}"
          test -x "$jdk/bin/java"
          echo "JAVA_HOME=$jdk" >> "$GITHUB_ENV"
          echo "$jdk/bin" >> "$GITHUB_PATH"
      - name: Run the project's local checks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch || -z "$BASE" || "$BASE" =~ ^0+$ ]] || ! git -C project merge-base --is-ancestor "$BASE" HEAD; then
            node plugin/scripts/project-checks.mjs project full
          else
            node plugin/scripts/project-checks.mjs project changed "$BASE"
          fi
