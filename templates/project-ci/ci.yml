name: Project CI
# This workflow belongs to the project. It checks out the project and nothing else, and runs only the project's own
# files: the path and secret scan and the site check under scripts/ci/. On the default branch it then publishes the
# docs folder to GitHub Pages. It runs no design check: a design is checked before it is pushed.
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Scan and site check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Set lfs: true when a published file is stored with Git LFS.
          # In a large repository the checkout can take longer than every check. The scan reads every tracked file, so
          # this job needs the whole tree. A job that reads a few folders checks out only those:
          # sparse-checkout: |
          #   docs
          #   scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # A personal machine path or a credential is public as soon as the branch is pushed.
      - name: Scan for personal paths and secrets
        run: node scripts/ci/scan.mjs .
      # Every listed design has its folder, every named file is there and every relative link leads somewhere.
      - name: Check the published site
        run: node scripts/ci/site-check.mjs docs
      # Add the project's own tests here, as steps that run the project's own commands.
      # How the site is published: gh api repos/OWNER/REPO/pages --jq .build_type
      #   workflow  GitHub Actions publishes it. Keep this step and the deploy job.
      #   legacy    GitHub serves a branch folder itself. Delete this step and the deploy job.
      - if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    name: Publish the site
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
